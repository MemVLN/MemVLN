# @package _global_

# train
task:
  training:
    lr: 2e-6
    epochs: 1
    dummy_lr_decay: False

  leomix:
    LeoMix:
      mode: [train]
      mix:
        vln: [realworld]
      # Episode-level multiplier oversamples real-world demonstrations.
      ratio: [6.0]
      ratio_unit: episode
      train_dataloader_args: ${dataloader.train}
      use_custom_sampler: True

# no eval by default; enable vlnce below when running regression checks
