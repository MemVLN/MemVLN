# train
training:
  lr: 2e-5
  epochs: 1
  dummy_lr_decay: True

dataset_mix:
  VLNDatasetMix:
    mode: [train]
    mix:
      vln:
        - mp3d_r2r
        - traj_sum_mp3d_r2r
    # With the custom sampler, sample mode requires all ratios to stay at 1.
    # To repeat paired navigation/summary trajectories, use episode and [2, 2].
    ratio_unit: sample
    # Multipliers follow the dataset order above; paired replays share memory.
    ratio:
      - 1.0  # R2R navigation
      - 1.0  # R2R trajectory summary
    train_dataloader_args: ${dataloader.train}
    # Consume each episode in temporal order; independent of ratio_unit.
    use_custom_sampler: True
    sampling:
      # Single-domain variant of the rank-local fixed-update episode sampler.
      mode: epoch
      dataset_probabilities: {r2r: 1.0}

vlnce:
  R2R:
    mode: []
    evaluator: VLNCEEvaluator
    args:
      habitat_config_path: "habitat/r2r.yaml"
      split: "val_unseen"
      env_num: ${num_gpu}
      save_video: 10
