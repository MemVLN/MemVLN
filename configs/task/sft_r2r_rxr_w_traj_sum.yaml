# train
training:
  lr: 2e-5
  epochs: 1
  dummy_lr_decay: True

dataset_mix:
  VLNDatasetMix:
    mode: [train]
    mix:
      vln:
        - mp3d_r2r
        - mp3d_rxr
        - traj_sum_mp3d_r2r
        - traj_sum_mp3d_rxr
    # With the custom sampler, sample mode requires all ratios to stay at 1.
    # To repeat R2R twice and RxR once, use episode and ratio: [2, 1, 2, 1].
    ratio_unit: sample
    # Multipliers follow the dataset order above; paired replays share memory.
    ratio:
      - 1.0  # R2R navigation
      - 1.0  # RxR navigation
      - 1.0  # R2R trajectory summary
      - 1.0  # RxR trajectory summary
    train_dataloader_args: ${dataloader.train}
    # Consume each episode in temporal order; independent of ratio_unit.
    use_custom_sampler: True
    sampling:
      # Opt in with probabilistic_episode, ratio_unit=episode, dummy_lr_decay=false,
      # and training.max_updates. Probabilities select a domain once per episode.
      mode: epoch
      dataset_probabilities: {r2r: 0.5, rxr: 0.5}

vlnce:
  R2R:
    mode: []
    evaluator: VLNCEEvaluator
    args:
      habitat_config_path: "habitat/r2r.yaml"
      split: "val_unseen"
      env_num: ${num_gpu}
      save_video: 10
  RxR:
    mode: []
    evaluator: VLNCEEvaluator
    args:
      habitat_config_path: "habitat/rxr.yaml"
      split: "val_unseen"
      env_num: ${num_gpu}
      save_video: 10
