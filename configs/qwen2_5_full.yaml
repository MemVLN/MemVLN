defaults:
  - data: default
  - task: sft_r2r_rxr_v2_w_traj_sum_w_mem
  - llm: qwen2_5-7b-mem
  - vision3d: streamvggt
  - _self_

name: Qwen2.5-VLNCE
note: qwen2_5_7b_full_memvln_r2r_rxr_v2

rng_seed: 42
num_gpu: 1
mode: train
naming_keywords: [note]
base_dir: ${oc.env:MEMVLN_OUTPUT_DIR,outputs}
exp_dir: ""
pretrained_ckpt_path: ""

logger:
  name: wandb
  entity: bigai-gvl

dataloader:
  train:
    batchsize: 1
    num_workers: 1
  eval:
    batchsize: 1
    num_workers: 1

debug: False
blind: False
train_infer: False

vision3d:
  ckpt_path: ${oc.env:STREAMVGGT_CKPT,/Users/jetpack/Documents/pretrained_weights/StreamVGGT-1B.pth}
  # Keep the Qwen3 StreamVGGT geometry branch at 30x40 patches (420x560).
  input_grid_hw: [30, 40]

inference:
  enabled: True
  cache_grounded_memory: False
  skip_memory_attention_weights: False
  fast_habitat: False
  empty_cache_on_episode_end: False
  video_selection_seed: ${rng_seed}

reproducibility:
  write_manifest: True
  require_pinned_revision: True

trainer: LeoTrainer
training:
  epochs: ${task.training.epochs}
  gradient_accumulation_steps: 1
  # Optional smoke-test controls; formal runs keep the full epoch and native
  # activation behavior unless explicitly overridden.
  max_train_batches: null
  gradient_checkpointing: False
  grad_norm: 1.0
  optim:
    name: AdamW
    args:
      lr: ${task.training.lr}
      betas: [0.9, 0.999]
      weight_decay: 0.05
  schedule:
    name: linear_warmup_cosine_decay
    args:
      warmup_steps: 400
  save_interval: 5000
  checkpoint_total_limit: 5

eval:
  num_batch_val: 10
  val_interval: 1e8
