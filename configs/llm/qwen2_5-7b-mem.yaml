name: Qwen2.5-7B
model_family: qwen2_5_vl
cfg_path: ${oc.env:QWEN25_VL_7B_PATH,/Users/jetpack/Documents/pretrained_weights/Qwen2.5-VL-7B-Instruct}
# Set this to an immutable Hugging Face commit when cfg_path is a Hub model ID.
# Local checkpoints are pinned by the runtime shard manifest hash instead.
revision: null
torch_dtype: bf16
attn_implementation: flash_attention_2
padding_side: left
max_context_len: 128000
max_out_len: 256
hidden_dim: 3584
tune_proj: False
lora:
  flag: True
  # Keep Baseline and Full on the same earlier Qwen2.5-VL LoRA recipe.
  rank: 16
  alpha: 16
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.0
mem_module:
  param_dtype: bf16
  feature_dim: ${llm.hidden_dim}
  frame_max_tokens_num: 100
  episode_max_frame_num: 100
  memory_consolidate_type: frme
  use_pos_embed: fourier
  pos_embed_fourier_feat_num: 32
  pos_embed_learnable: True
  pos_embed_mlp_hidden: 512
  pos_embed_mapping_type: rff
  use_time_embed: sinus
  time_embed_max_length_num: 500
  retrieval_mha_heads_num: 16
  retrieval_layers_num: 2
  tome_mha_heads_num: 16
  tome_layers_num: 2
  memory_token_num: 300
  memory_merge_vggt_feat: False
  visual_obs_mask_ratio_nav: 0.0
  visual_obs_mask_ratio_aux: 1.0
